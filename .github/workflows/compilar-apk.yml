name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Copiar el emulador y el núcleo dentro de la app
        run: node scripts/prepare.js

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Sincronizar archivos web
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk N64-Portatil.apk

      - uses: actions/upload-artifact@v4
        with:
          name: N64-Portatil-APK
          path: N64-Portatil.apk
          if-no-files-found: error

      - name: Publicar el APK como versión descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" N64-Portatil.apk \
            --title "N64 Portátil (compilación ${{ github.run_number }})" \
            --notes "APK listo para instalar en Android."
