<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>N64 Portátil</title>
  <link rel="stylesheet" href="app.css">
  <style>
    html, body { height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; touch-action: none; }
    #game { position: fixed; inset: 0; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #cfd3da; background: #000; }
    #boot.err { color: #ffb4a8; }
    #menuBtn { position: fixed; z-index: 20; top: calc(env(safe-area-inset-top) + 6px); left: 50%; transform: translateX(-50%);
      min-height: 30px; padding: 0 14px; opacity: .45; border-radius: 15px; background: rgba(20,22,26,.8); font-size: 13px; }
    #menuBtn:active { opacity: .9; }
    #panel .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #panel label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 10px; }
    #panel select { min-height: 40px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; }
  </style>
</head>
<body>
  <div id="boot">Cargando…</div>
  <div id="game"></div>
  <button id="menuBtn" hidden>Menú</button>
  <div class="backdrop" id="bd"></div>
  <div class="sheet" id="panel">
    <h3 id="ptitle">Menú</h3>
    <p class="sub">Los estados guardados se conservan en el teléfono, también sin conexión.</p>
    <label>Ranura de guardado
      <select id="slot"></select>
    </label>
    <div class="row2">
      <button id="bSave">Guardar estado</button>
      <button id="bLoad">Cargar estado</button>
      <button id="bReset">Reiniciar</button>
      <button id="bPause">Pausar</button>
    </div>
    <div class="acts" style="margin-top:10px">
      <button class="primary" id="bResume">Seguir jugando</button>
      <button class="danger" id="bExit">Salir al listado</button>
    </div>
  </div>
  <div id="toast"></div>
  <script src="lib.js"></script>
  <script src="game.js"></script>
</body>
</html>
